<div class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded">
    <strong>Rescan complete!</strong> Processed {{.Total}} broker emails.
    <div class="mt-2 text-sm grid grid-cols-2 gap-2">
        <div>Updated: <span class="font-semibold">{{.Updated}}</span></div>
        <div>New: <span class="font-semibold">{{.Inserted}}</span></div>
    </div>
    <div class="mt-2 text-sm grid grid-cols-3 gap-2">
        <div>Success: <span class="font-semibold">{{.Success}}</span></div>
        <div>Form required: <span class="font-semibold">{{.FormRequired}}</span></div>
        <div>Confirm required: <span class="font-semibold">{{.ConfirmRequired}}</span></div>
        <div>Pending: <span class="font-semibold">{{.Pending}}</span></div>
        <div>Rejected: <span class="font-semibold">{{.Rejected}}</span></div>
        <div>Unknown: <span class="font-semibold">{{.Unknown}}</span></div>
    </div>
    <p class="mt-2 text-sm">
        <a href="/tasks" class="underline font-medium">View action items</a> |
        <a href="/pipeline" class="underline" onclick="window.location.reload()">Refresh page</a>
    </p>
</div>
