<div class="bg-{{.BgColor}}-100 border border-{{.BorderColor}}-400 text-{{.TextColor}} px-4 py-3 rounded">
    <strong>{{.Title}}</strong>
    {{if .Message}}<p class="mt-1 text-sm">{{.Message}}</p>{{end}}
    {{if .HTML}}<div class="mt-1 text-sm">{{.HTML}}</div>{{end}}
</div>
{{if .Footer}}<div class="mt-4">{{.Footer}}</div>{{end}}
