name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - run: go mod download

      - run: go vet ./...

      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v6
